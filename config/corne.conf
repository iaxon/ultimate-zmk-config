# Enable ZMK Display
CONFIG_ZMK_DISPLAY=y

# Standard Widgets (Required for connection info)
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# Fix for peripheral (right) side display
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILTIN=y

# External power for OLED (Required to wake up the right screen)
CONFIG_ZMK_EXT_POWER=y

# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Enable mouse
CONFIG_ZMK_POINTING=y

# Bluetooth tweaks (Kept simple)
# CONFIG_ZMK_BLE=y
