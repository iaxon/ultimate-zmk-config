# https://github.com/manna-harbour/miryoku

name: 'Main'
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'build.yaml'
      - '.github/workflows/build.yml'

jobs:
  main:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-dev-arm:3.5
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nice_nano
            shield: corne_left
          - board: nice_nano
            shield: corne_right
          - board: corneish_zen_left@2.0.0
          - board: corneish_zen_right@2.0.0
          - board: glove80_lh
          - board: glove80_rh
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: 'miryoku_zmk'
      - name: build
        run: |
          mkdir -p artifacts
          cd miryoku_zmk
          west init -l config
          west update
          west zephyr-export
          
          board="${{ matrix.board }}"
          shield="${{ matrix.shield }}"
          # Handle the //zmk suffix if needed, but here we just use the board name
          # strip @revision and //zmk for the filename
          clean_board=$(echo $board | sed 's/@.*//' | sed 's|//.*||')
          artifact_name="${clean_board}${shield:+-$shield}"
          
          west build -s zmk/app -b "$board" -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/miryoku_zmk/config" ${shield:+-DSHIELD="$shield"}
          
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 "../artifacts/${artifact_name}.uf2"
          elif [ -f build/zephyr/zmk.bin ]; then
            cp build/zephyr/zmk.bin "../artifacts/${artifact_name}.bin"
          fi
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}${{ matrix.shield && '-' }}${{ matrix.shield }}
          path: artifacts/
